global:
  scrape_interval: 10s
  evaluation_interval: 10s
  external_labels:
    environment: development
    service: inference-gateway

scrape_configs:
  - job_name: "inference-gateway"
    static_configs:
      - targets: ["host.docker.internal:8000"]
    metrics_path: /metrics
    scrape_interval: 5s

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]