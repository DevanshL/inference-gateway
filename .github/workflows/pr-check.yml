
name: PR Check

on:
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-asyncio pyyaml

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short
        env:
          GATEWAY_ENV: development
          OLLAMA_BASE_URL: http://localhost:11434
          REDIS_URL: redis://localhost:6379/0
          ROUTING_FAST_MODEL: mistral:latest
          ROUTING_QUALITY_MODEL: llama3.2:latest
          ROUTING_CODE_MODEL: qwen2.5-coder:7b
          ROUTING_VISION_MODEL: llava:7b
          GATEWAY_API_KEYS: ""

      - name: Comment test results on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const outcome = '${{ job.status }}';
            const emoji = outcome === 'success' ? '✅' : '❌';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `${emoji} Tests ${outcome} on commit ${context.sha.slice(0,7)}`
            });