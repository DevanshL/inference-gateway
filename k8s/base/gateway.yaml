apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: inference-gateway
  labels:
    app: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0        # zero-downtime deploys
  template:
    metadata:
      labels:
        app: gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: gateway
          image: inference-gateway:latest
          imagePullPolicy: Never            # use local Minikube image
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: gateway-config
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]   # drain in-flight requests
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  namespace: inference-gateway
spec:
  selector:
    app: gateway
  ports:
    - port: 80
      targetPort: 8000
      name: http
  type: ClusterIP
---
# ── HPA — scale gateway pods on CPU ──────────────────────────────────────────
# When CPU > 60% → add pods, up to 5
# When CPU drops → scale back down after 3 minutes
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gateway-hpa
  namespace: inference-gateway
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gateway
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30      # react fast to spikes
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 180     # don't scale down too quickly
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60