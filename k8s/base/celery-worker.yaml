apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-worker
  namespace: inference-gateway
  labels:
    app: celery-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: celery-worker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 2
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: celery-worker
    spec:
      containers:
        - name: celery-worker
          image: inference-gateway:latest
          imagePullPolicy: Never
          # Override entrypoint — same image, different command
          command:
            - celery
            - -A
            - app.worker.celery_app
            - worker
            - --loglevel=info
            - -Q
            - inference
            - --concurrency=2
          envFrom:
            - configMapRef:
                name: gateway-config
          env:
            - name: PYTHONPATH
              value: "/app"
          resources:
            requests:
              memory: "256Mi"
              cpu: "300m"
            limits:
              memory: "768Mi"
              cpu: "1500m"
          livenessProbe:
            exec:
              command:
                - celery
                - -A
                - app.worker.celery_app
                - inspect
                - ping
                - -d
                - "celery@$HOSTNAME"
            initialDelaySeconds: 30
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 3
---
# ── HPA — scale Celery workers on CPU ────────────────────────────────────────
# Under heavy async load → more workers spin up automatically
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: celery-worker-hpa
  namespace: inference-gateway
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: celery-worker
  minReplicas: 1
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 15      # workers need to react fast
      policies:
        - type: Pods
          value: 3
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300     # let workers finish jobs before killing
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120